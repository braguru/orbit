name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release branch, tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release.sh
